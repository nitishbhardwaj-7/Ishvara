<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="50%" stop-color="#0e0c0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="35%" stop-color="#E5BE6C"/>
      <stop offset="70%" stop-color="#C2943A"/>
      <stop offset="100%" stop-color="#8F6218"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>
  
  <!-- Sacred Halo Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.15"/>

  <!-- Sacred OM Symbol -->
  <text x="256" y="325" font-family="'Lazzer', 'Georgia', serif" font-size="210" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">ॐ</text>

  <!-- Title & Subtitle -->
  <text x="256" y="415" font-family="'Lazzer', sans-serif" font-size="28" font-weight="700" letter-spacing="9" fill="#F4D99B" text-anchor="middle" opacity="0.95">ISHVARA</text>
  <text x="256" y="445" font-family="'Lazzer', sans-serif" font-size="13" font-weight="500" letter-spacing="4" fill="#A88B52" text-anchor="middle" opacity="0.8">SACRED SADHANA</text>
</svg>