name: Deploy website & admin

# Publishes to GitHub Pages:
#   /             → landing page
#   /privacy.html → privacy policy (link this in Google Play Console)
#   /admin/       → content uploader (sign-in protected)
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['admin/**', 'site/**', 'vite.admin.config.ts', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build admin
        run: bunx vite build --config vite.admin.config.ts

      - name: Assemble site
        env:
          SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
        run: |
          mkdir -p public_site
          cp -r site/. public_site/
          cp -r dist-admin public_site/admin
          # Fill in the contact email in the static pages
          sed -i "s|__SUPPORT_EMAIL__|${SUPPORT_EMAIL:-support@example.com}|g" public_site/*.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public_site

      - id: deployment
        uses: actions/deploy-pages@v4
