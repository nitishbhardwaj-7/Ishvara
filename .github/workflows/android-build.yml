name: Build Android App

# Always builds an installable APK for testing.
# When the ANDROID_KEYSTORE_BASE64 secret is set, also builds a signed release
# AAB (upload this one to Google Play) and a signed release APK.

on:
  push:
    branches: [main]
    paths-ignore: ['admin/**', 'site/**', 'supabase/**', '*.md', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      VITE_PRIVACY_POLICY_URL: ${{ vars.VITE_PRIVACY_POLICY_URL }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read app version
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Warn if content service is not configured
        if: env.VITE_SUPABASE_URL == ''
        run: echo "::warning::VITE_SUPABASE_URL repo variable is not set — the app will show no content. See SETUP.md."

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build web app
        run: VITE_APP_VERSION="$VERSION_NAME" bunx vite build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Decode signing key
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No signing key configured — building debug APK only. See SETUP.md to enable Play Store builds."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew bundleRelease assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect outputs
        run: |
          mkdir -p out
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/ishvara-v${VERSION_NAME}-${VERSION_CODE}.aab"
            cp android/app/build/outputs/apk/release/app-release.apk out/ishvara.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/ishvara.apk
          fi
          ls -la out

      - name: Upload AAB (for Google Play)
        if: steps.keystore.outputs.signed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ishvara-play-store-aab
          path: out/*.aab
          retention-days: 90

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ishvara-apk
          path: out/ishvara.apk
          retention-days: 30

      - name: Move "latest" tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish "latest" test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ishvara — Latest Build (${{ env.VERSION_NAME }} / ${{ env.VERSION_CODE }})
          body: |
            Built from `${{ github.sha }}`.

            **ishvara.apk** — install directly on an Android phone for testing
            (allow "install from unknown sources" if prompted).
            ${{ steps.keystore.outputs.signed == 'true' && 'The Play Store upload file (.aab) is attached to the workflow run under Artifacts.' || 'Debug build — set up signing (SETUP.md) to get Play Store builds.' }}
          prerelease: true
          make_latest: true
          files: out/ishvara.apk
